name: Agentic QA PBI Validation

run-name: Agentic QA - PR #${{ github.event.pull_request.number }}

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened


permissions:
  contents: read


jobs:

  qa-validation:

    if: startsWith(github.head_ref, 'qa/')

    runs-on: ubuntu-latest

    timeout-minutes: 30


    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout PR commit
        uses: actions/checkout@v4

        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0


      # ======================================================
      # CONTEXT
      # ======================================================

      - name: Display execution context
        shell: bash

        run: |
          echo "======================================"
          echo "Agentic QA PBI Validation"
          echo "======================================"

          echo "Repository  : ${{ github.repository }}"
          echo "PR Number   : ${{ github.event.pull_request.number }}"
          echo "QA Branch   : ${{ github.head_ref }}"
          echo "Base Branch : ${{ github.base_ref }}"
          echo "Commit SHA  : ${{ github.event.pull_request.head.sha }}"


      # ======================================================
      # DETECT PBI TESTS
      # ======================================================

      - name: Detect changed Playwright tests
        id: changed_tests
        shell: bash

        run: |
          set -euo pipefail

          git fetch origin "${{ github.base_ref }}"

          mapfile -t CHANGED_FILES < <(
            git diff \
              --name-only \
              --diff-filter=AM \
              "origin/${{ github.base_ref }}...HEAD"
          )

          echo ""
          echo "Files changed in PR:"
          echo "======================================"

          printf '%s\n' "${CHANGED_FILES[@]}"

          TEST_FILES=()

          for file in "${CHANGED_FILES[@]}"; do

            case "$file" in

              *.spec.js|\
              *.test.js|\
              *.spec.ts|\
              *.test.ts)

                if [ -f "$file" ]; then
                  TEST_FILES+=("$file")
                fi

                ;;

            esac

          done


          if [ "${#TEST_FILES[@]}" -eq 0 ]; then

            echo ""
            echo "ERROR:"
            echo "No PBI-related Playwright tests found."

            exit 1

          fi


          echo ""
          echo "PBI tests selected:"
          echo "======================================"

          printf '%s\n' "${TEST_FILES[@]}"


          {
            echo "files<<EOF"
            printf '%s\n' "${TEST_FILES[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"


      # ======================================================
      # NODE
      # ======================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: "20"
          cache: npm


      # ======================================================
      # INSTALL
      # ======================================================

      - name: Install dependencies
        shell: bash

        run: |
          set -euo pipefail

          if [ ! -f package.json ]; then

            echo "package.json not found."

            exit 1

          fi


          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi


      - name: Verify Playwright
        run: npx playwright --version


      - name: Install Playwright browsers
        run: npx playwright install --with-deps


      # ======================================================
      # CREATE TEMPORARY AGENTIC CONFIG
      #
      # Existing repo config remains untouched.
      # ======================================================

      - name: Create temporary Agentic Playwright config
        shell: bash

        run: |
          cat > playwright.agentic.config.ts <<'EOF'

          import {
            defineConfig,
            devices
          } from '@playwright/test';


          export default defineConfig({

            testDir: '.',

            testMatch: [
              '**/*.spec.js',
              '**/*.test.js',
              '**/*.spec.ts',
              '**/*.test.ts'
            ],

            forbidOnly: true,

            retries: 1,

            workers: 1,

            timeout: 30_000,

            expect: {
              timeout: 10_000
            },


            outputDir: 'test-results',


            reporter: [

              [
                'list'
              ],

              [
                'html',
                {
                  outputFolder: 'playwright-report',
                  open: 'never'
                }
              ],

              [
                'junit',
                {
                  outputFile: 'test-results/junit.xml'
                }
              ]

            ],


            use: {

              baseURL:
                process.env.BASE_URL ||
                'https://nidhisingh25901.github.io/portfolio-/',

              navigationTimeout: 30_000,

              trace: 'retain-on-failure',

              screenshot: 'only-on-failure',

              video: 'retain-on-failure'

            },


            projects: [

              {
                name: 'agentic-pbi',

                use: {
                  ...devices['Desktop Chrome']
                }
              }

            ]

          });

          EOF


      # ======================================================
      # DISCOVERY
      # ======================================================

      - name: Validate PBI test discovery
        shell: bash

        env:
          CHANGED_TESTS: ${{ steps.changed_tests.outputs.files }}

        run: |
          set -euo pipefail

          mapfile -t TEST_FILES <<< "$CHANGED_TESTS"

          echo "======================================"
          echo "Playwright Discovery"
          echo "======================================"

          printf '%s\n' "${TEST_FILES[@]}"

          npx playwright test \
            --config=playwright.agentic.config.ts \
            --project=agentic-pbi \
            --list \
            "${TEST_FILES[@]}"


      # ======================================================
      # EXECUTE
      # ======================================================

      - name: Execute PBI Playwright tests
        shell: bash

        env:
          CHANGED_TESTS: ${{ steps.changed_tests.outputs.files }}

        run: |
          set -euo pipefail

          mapfile -t TEST_FILES <<< "$CHANGED_TESTS"

          echo "======================================"
          echo "Starting PBI Test Execution"
          echo "======================================"

          printf '%s\n' "${TEST_FILES[@]}"

          npx playwright test \
            --config=playwright.agentic.config.ts \
            --project=agentic-pbi \
            "${TEST_FILES[@]}"


      # ======================================================
      # HTML REPORT
      # ======================================================

      - name: Upload Playwright report
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: playwright-report-pr-${{ github.event.pull_request.number }}

          path: playwright-report/

          if-no-files-found: ignore

          retention-days: 7


      # ======================================================
      # JUNIT + TRACE + SCREENSHOT + VIDEO
      # ======================================================

      - name: Upload Playwright evidence
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: test-results-pr-${{ github.event.pull_request.number }}

          path: test-results/

          if-no-files-found: ignore

          retention-days: 7


      # ======================================================
      # SUMMARY
      # ======================================================

      - name: Write Agentic QA summary
        if: always()

        shell: bash

        env:
          CHANGED_TESTS: ${{ steps.changed_tests.outputs.files }}

        run: |
          echo "# Agentic QA PBI Validation" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "**PR:** #${{ github.event.pull_request.number }}" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "**Branch:** \`${{ github.head_ref }}\`" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "**Commit:** \`${{ github.event.pull_request.head.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## PBI Tests" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r file; do

            if [ -n "$file" ]; then

              echo "- \`$file\`" >> "$GITHUB_STEP_SUMMARY"

            fi

          done <<< "$CHANGED_TESTS"
