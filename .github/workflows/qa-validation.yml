name: Agentic QA PBI Validation

run-name: Agentic QA - PR #${{ github.event.pull_request.number }}

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  qa-validation:

    # Only QA branches generated by Agentic QA
    if: startsWith(github.head_ref, 'qa/')

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # ======================================================
      # 1. CHECKOUT EXACT PR COMMIT
      # ======================================================

      - name: Checkout PR commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0


      # ======================================================
      # 2. DISPLAY EXECUTION CONTEXT
      # ======================================================

      - name: Display execution context
        shell: bash
        run: |
          echo "======================================"
          echo "Agentic QA PBI Validation"
          echo "======================================"

          echo "Repository  : ${{ github.repository }}"
          echo "PR Number   : ${{ github.event.pull_request.number }}"
          echo "QA Branch   : ${{ github.head_ref }}"
          echo "Base Branch : ${{ github.base_ref }}"
          echo "Commit SHA  : ${{ github.event.pull_request.head.sha }}"


      # ======================================================
      # 3. FIND TEST FILES CHANGED BY THIS PR
      #
      # Supports both:
      #   JavaScript
      #   TypeScript
      # ======================================================

      - name: Detect changed Playwright tests
        id: changed_tests
        shell: bash
        run: |
          set -euo pipefail

          echo "Fetching base branch..."

          git fetch origin "${{ github.base_ref }}"

          echo ""
          echo "======================================"
          echo "Files changed by this PR"
          echo "======================================"

          mapfile -t CHANGED_FILES < <(
            git diff \
              --name-only \
              --diff-filter=AM \
              "origin/${{ github.base_ref }}...HEAD"
          )

          printf '%s\n' "${CHANGED_FILES[@]}"

          TEST_FILES=()

          for file in "${CHANGED_FILES[@]}"; do

            case "$file" in
              *.spec.js|\
              *.test.js|\
              *.spec.ts|\
              *.test.ts)

                if [ -f "$file" ]; then
                  TEST_FILES+=("$file")
                fi

                ;;
            esac

          done

          echo ""
          echo "======================================"
          echo "PBI Test Files"
          echo "======================================"

          if [ "${#TEST_FILES[@]}" -eq 0 ]; then

            echo "ERROR:"
            echo "No JavaScript or TypeScript test files"
            echo "were added or modified by this PR."

            exit 1

          fi

          printf '%s\n' "${TEST_FILES[@]}"

          {
            echo "files<<EOF"
            printf '%s\n' "${TEST_FILES[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"


      # ======================================================
      # 4. VERIFY FILES EXIST
      # ======================================================

      - name: Verify PBI test files
        shell: bash

        env:
          CHANGED_TESTS: ${{ steps.changed_tests.outputs.files }}

        run: |
          set -euo pipefail

          mapfile -t TEST_FILES <<< "$CHANGED_TESTS"

          for file in "${TEST_FILES[@]}"; do

            echo ""
            echo "Checking: $file"

            if [ ! -f "$file" ]; then
              echo "ERROR: Test file does not exist."
              exit 1
            fi

            echo "FOUND: $file"

          done


      # ======================================================
      # 5. SETUP NODE
      # ======================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm


      # ======================================================
      # 6. INSTALL REPOSITORY DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "package.json" ]; then

            echo "ERROR:"
            echo "package.json was not found."

            exit 1

          fi

          if [ -f "package-lock.json" ]; then

            echo "Installing dependencies with npm ci..."

            npm ci

          else

            echo "package-lock.json was not found."
            echo "Using npm install..."

            npm install

          fi


      # ======================================================
      # 7. VERIFY PLAYWRIGHT
      # ======================================================

      - name: Verify Playwright
        shell: bash
        run: |
          set -euo pipefail

          echo "Playwright version:"

          npx playwright --version


      # ======================================================
      # 8. INSTALL PLAYWRIGHT BROWSERS
      # ======================================================

      - name: Install Playwright browsers
        shell: bash
        run: |
          set -euo pipefail

          npx playwright install --with-deps


      # ======================================================
      # 9. CREATE TEMPORARY AGENTIC EXECUTION CONFIG
      #
      # Important:
      #
      # We DO NOT modify the repository's existing
      # playwright.config.ts/js.
      #
      # This temporary config exists only inside
      # the GitHub Actions runner.
      #
      # Supports:
      #   *.spec.js
      #   *.test.js
      #   *.spec.ts
      #   *.test.ts
      # ======================================================

      - name: Create temporary Agentic Playwright config
        shell: bash
        run: |
          cat > playwright.agentic.config.ts <<'EOF'

          import {
            defineConfig,
            devices
          } from '@playwright/test';


          export default defineConfig({

            /*
             * Search from repository root because generated
             * automation may exist under tests/, e2e/,
             * specs/, integration/, etc.
             */

            testDir: '.',


            /*
             * Allow both JavaScript and TypeScript.
             */

            testMatch: [
              '**/*.spec.js',
              '**/*.test.js',
              '**/*.spec.ts',
              '**/*.test.ts'
            ],


            /*
             * CI safety controls.
             */

            forbidOnly: true,

            retries: 1,

            workers: 1,

            timeout: 30_000,


            expect: {
              timeout: 10_000
            },


            /*
             * Reports
             */

            reporter: [
              ['list'],

              [
                'html',
                {
                  outputFolder: 'playwright-report',
                  open: 'never'
                }
              ]
            ],


            /*
             * Generic execution profile.
             *
             * BASE_URL can be supplied by the repository
             * or GitHub environment.
             */

            use: {

              baseURL:
                process.env.BASE_URL ||
                'https://nidhisingh25901.github.io/portfolio-/',

              navigationTimeout: 30_000,

              trace: 'retain-on-failure',

              screenshot: 'only-on-failure',

              video: 'retain-on-failure'
            },


            /*
             * One neutral execution project.
             *
             * This prevents the repository's existing
             * project-level testMatch rules from blocking
             * Agentic-generated test files.
             */

            projects: [

              {
                name: 'agentic-pbi',

                use: {
                  ...devices['Desktop Chrome']
                }
              }

            ]

          });

          EOF

          echo ""
          echo "======================================"
          echo "Temporary Agentic Playwright config"
          echo "======================================"

          cat playwright.agentic.config.ts


      # ======================================================
      # 10. CHECK WHETHER GENERATED TESTS ARE DISCOVERABLE
      # ======================================================

      - name: Validate PBI test discovery
        shell: bash

        env:
          CHANGED_TESTS: ${{ steps.changed_tests.outputs.files }}

        run: |
          set -euo pipefail

          mapfile -t TEST_FILES <<< "$CHANGED_TESTS"

          echo "======================================"
          echo "Playwright Test Discovery"
          echo "======================================"

          printf '%s\n' "${TEST_FILES[@]}"

          echo ""

          npx playwright test \
            --config=playwright.agentic.config.ts \
            --project=agentic-pbi \
            --list \
            "${TEST_FILES[@]}"


      # ======================================================
      # 11. EXECUTE ONLY THIS PBI'S TEST FILES
      # ======================================================

      - name: Execute PBI Playwright tests
        shell: bash

        env:
          CHANGED_TESTS: ${{ steps.changed_tests.outputs.files }}

        run: |
          set -euo pipefail

          mapfile -t TEST_FILES <<< "$CHANGED_TESTS"

          echo "======================================"
          echo "Starting Playwright Execution"
          echo "======================================"

          echo ""
          echo "Only these tests will execute:"

          printf '%s\n' "${TEST_FILES[@]}"

          echo ""

          npx playwright test \
            --config=playwright.agentic.config.ts \
            --project=agentic-pbi \
            "${TEST_FILES[@]}"


      # ======================================================
      # 12. UPLOAD HTML REPORT
      # ======================================================

      - name: Upload Playwright report
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: playwright-report-pr-${{ github.event.pull_request.number }}

          path: playwright-report/

          if-no-files-found: ignore

          retention-days: 7


      # ======================================================
      # 13. UPLOAD TEST EVIDENCE
      #
      # Playwright stores screenshots, traces and videos
      # here when configured to retain them.
      # ======================================================

      - name: Upload Playwright test evidence
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: test-results-pr-${{ github.event.pull_request.number }}

          path: test-results/

          if-no-files-found: ignore

          retention-days: 7


      # ======================================================
      # 14. GITHUB ACTIONS SUMMARY
      # ======================================================

      - name: Write Agentic QA summary
        if: always()

        shell: bash

        env:
          CHANGED_TESTS: ${{ steps.changed_tests.outputs.files }}

        run: |
          echo "# Agentic QA PBI Validation" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "**Repository:** \`${{ github.repository }}\`" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "**PR:** #${{ github.event.pull_request.number }}" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "**Branch:** \`${{ github.head_ref }}\`" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "**Commit:** \`${{ github.event.pull_request.head.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## PBI-related test files" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r file; do

            if [ -n "$file" ]; then
              echo "- \`$file\`" >> "$GITHUB_STEP_SUMMARY"
            fi

          done <<< "$CHANGED_TESTS"
